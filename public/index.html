<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秘書</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6f8f">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="秘書">
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --ink:#1f2d3d; --muted:#6b7886; --line:#dde3ea;
    --me:#2f6f8f; --me-ink:#fff; --ai:#f3f6f9; --ai-ink:#1f2d3d; --accent:#2f6f8f;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1620; --panel:#17212d; --ink:#e4ebf2; --muted:#8a97a4; --line:#2a3744;
    --me:#3d82a3; --me-ink:#fff; --ai:#1d2a38; --ai-ink:#e4ebf2; --accent:#6fb0cc;
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    display:flex;flex-direction:column;height:100dvh}
  header{background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
    font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
  header .dot{width:9px;height:9px;border-radius:50%;background:#2fae6a}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bub{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.6;
    font-size:15px;white-space:pre-wrap;word-break:break-word}
  .me .bub{background:var(--me);color:var(--me-ink);border-bottom-right-radius:5px}
  .ai .bub{background:var(--ai);color:var(--ai-ink);border:1px solid var(--line);border-bottom-left-radius:5px}
  .hint{color:var(--muted);font-size:13px;text-align:center;margin:auto 0}
  footer{background:var(--panel);border-top:1px solid var(--line);
    padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);
    max-height:140px;min-height:44px}
  button{border:none;border-radius:12px;background:var(--accent);color:#fff;
    font-weight:700;font-size:15px;padding:0 18px;height:44px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .typing .bub{color:var(--muted)}
</style>
</head>
<body>
  <header><span class="dot"></span><span id="title">秘書</span></header>
  <div id="log"><div class="hint">話しかけてください。<br>ここでの会話は、このパソコンの中だけに残ります。</div></div>
  <footer>
    <textarea id="box" rows="1" placeholder="メッセージを入力（Enterで送信）"></textarea>
    <button id="send">送信</button>
  </footer>

<script>
const log = document.getElementById('log');
const box = document.getElementById('box');
const send = document.getElementById('send');
let busy = false;

function clearHint(){ const h = log.querySelector('.hint'); if(h) h.remove(); }
function add(role, text){
  clearHint();
  const row = document.createElement('div'); row.className = 'row ' + role;
  const bub = document.createElement('div'); bub.className = 'bub'; bub.textContent = text;
  row.appendChild(bub); log.appendChild(row); log.scrollTop = log.scrollHeight;
  return bub;
}
function autosize(){ box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight,140) + 'px'; }
box.addEventListener('input', autosize);

async function ask(){
  const msg = box.value.trim();
  if(!msg || busy) return;
  busy = true; send.disabled = true;
  add('me', msg);
  box.value = ''; autosize();
  const row = document.createElement('div'); row.className = 'row ai typing';
  const bub = document.createElement('div'); bub.className = 'bub'; bub.textContent = '考えています…';
  row.appendChild(bub); log.appendChild(row); log.scrollTop = log.scrollHeight;
  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg })
    });
    const data = await r.json();
    row.classList.remove('typing');
    bub.textContent = data.reply || ('（エラー）' + (data.error || '返事が空でした'));
  }catch(e){
    row.classList.remove('typing');
    bub.textContent = '（つながりませんでした）' + e.message;
  }finally{
    busy = false; send.disabled = false; log.scrollTop = log.scrollHeight; box.focus();
  }
}
send.addEventListener('click', ask);
box.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});

// アシスタントの名前をタイトルに反映
fetch('/manifest.webmanifest').then(r=>r.json()).then(m=>{
  if(m && m.name){ document.getElementById('title').textContent = m.name; document.title = m.name; }
}).catch(()=>{});
</script>
</body>
</html>
